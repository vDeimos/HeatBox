name: Tool lock

# Once a week, and on request: downloads every file tools.lock.json names and
# checks its size and SHA-256 (scripts/check-tool-lock.sh). The app refuses a
# file that does not match, so if a builder moves or replaces a release,
# "Install the Programs" stops working for everyone. A red run here says so
# before a person finds out. It reads the lock and changes nothing.

on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - tools.lock.json
      - scripts/check-tool-lock.sh
      - .github/workflows/tool-lock.yml

permissions:
  contents: read

concurrency:
  group: tool-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every locked file is still there and unchanged
        run: scripts/check-tool-lock.sh
