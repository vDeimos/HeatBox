name: Release

# Pushing a tag such as v1.0.0 builds that exact commit, runs the tests,
# packs the universal app with its checksum, and attaches both to a DRAFT
# release. A person looks at the draft and publishes it (docs/RELEASING.md).
# Nothing here signs with an Apple account: signing is a switch for later
# (ADR-010), described in docs/RELEASING.md.
#
# Two jobs, so the token that can write the release is never in the job that
# runs the tests and installs: `build` only reads the repository, and `release`
# only receives the packed files from it. `release` needs nothing from macOS,
# so it runs on Linux, whose minutes count a tenth as much.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must match the version in the app
        run: |
          version="$(sed -n 's/.*static let version = "\(.*\)"/\1/p' Sources/Engine/Engine.swift)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Engine.version ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from the changelog
        run: |
          mkdir -p dist
          scripts/release-notes.sh "$VERSION" > dist/notes.md
      - name: Install the tools the integration tests run
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install yt-dlp ffmpeg deno
      - name: Lint and test
        run: |
          scripts/lint.sh
          scripts/test.sh
      - name: Pack the app
        env:
          UPDATE_NOTICE_URL: ${{ vars.UPDATE_NOTICE_URL }}
        run: scripts/package.sh
      - name: Hand the package to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Receive the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Record where the package came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --draft \
            --title "HeatBox $version" \
            --notes-file dist/notes.md \
            --verify-tag
