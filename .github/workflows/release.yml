name: Release

# Run by hand only (Actions > Release > Run workflow). It was once started by
# pushing a tag such as v1.0.0, which now does nothing: macOS minutes are paid
# and a tag must not spend them by accident. It builds the commit it is run on,
# runs the tests, packs the universal app with its checksum, and attaches both
# to a DRAFT release. A person looks at the draft and publishes it
# (docs/RELEASING.md, "Manual release").
# Nothing here signs with an Apple account: signing is a switch for later
#, described in docs/RELEASING.md.
#
# Two jobs, so the token that can write the release is never in the job that
# runs the tests and installs: `build` only reads the repository, and `release`
# only receives the packed files from it. `release` needs nothing from macOS,
# so it runs on Linux, whose minutes count a tenth as much.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must match the version in the app
        run: |
          version="$(sed -n 's/.*static let version = "\(.*\)"/\1/p' Sources/Engine/Engine.swift)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Engine.version ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from the changelog
        run: |
          mkdir -p dist
          scripts/release-notes.sh "$VERSION" > dist/notes.md
      - name: Install the tools the integration tests run
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install yt-dlp ffmpeg deno
      - name: Lint and test
        run: |
          scripts/lint.sh
          scripts/test.sh
      - name: Pack the app
        env:
          UPDATE_NOTICE_URL: ${{ vars.UPDATE_NOTICE_URL }}
        run: scripts/package.sh
      - name: Hand the package to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/notes.md
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Receive the package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - name: Record where the package came from
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --draft \
            --title "HeatBox $version" \
            --notes-file dist/notes.md \
            --verify-tag
