# Keeps the GitHub Actions the workflows use, which are pinned by commit, up
# to date: once a month, every newer action in one pull request, so the macOS
# CI runs once for all of them. The app itself has no package dependencies
# (Package.swift names none); its tools are pinned in tools.lock.json and
# checked by the "Tool lock" workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "Update"
