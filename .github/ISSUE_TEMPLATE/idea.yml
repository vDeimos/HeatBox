name: An idea
description: Something HeatBox could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The task, rather than the control you would add. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: false
